<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Media Host</title>
<style>
:root{--bg:#17111f;--card:#261c33;--rose:#b83a63;--plum:#5b3a8c;--text:#ffffff;--muted:#c9bcd8;
--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
background:var(--bg);color:var(--text);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:420px;background:var(--card);padding:28px 24px;border-radius:44px 8px 44px 8px}
.logo{display:block;width:56px;height:56px;margin:0 auto 12px}
h1{margin:0;text-align:center;font-size:1.4rem}
.sub{margin:6px 0 20px;text-align:center;color:var(--muted);font-size:.9rem}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btn,button{font:inherit;font-weight:700;color:var(--text);border:0;cursor:pointer;text-decoration:none;
display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;width:100%;
border-radius:20px 4px 20px 4px;background:var(--plum);
transition:transform 450ms var(--spring),opacity 150ms}
.btn:active,button:active{transform:scale(.95);transition:transform 100ms var(--out)}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.rose{background:var(--rose)}
button:disabled{opacity:.4;cursor:not-allowed}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
input[type=file]{display:none}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;min-height:84px;margin:0 0 12px;padding:12px;text-align:center;
border:2px dashed var(--plum);border-radius:28px 6px 28px 6px;cursor:pointer;color:var(--muted);word-break:break-all}
.status{min-height:1.4em;margin:12px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
.status.err{color:var(--text);background:var(--rose);border-radius:12px 3px 12px 3px;padding:6px 10px}
#preview{display:none;margin-top:16px;text-align:center}
#preview video,#preview img{max-width:100%;max-height:220px;border-radius:20px 4px 20px 4px}
#result{display:none;margin-top:16px}
#result input{width:100%;height:48px;margin-bottom:10px;padding:0 14px;background:var(--bg);color:var(--text);
border:2px solid var(--plum);border-radius:16px 4px 16px 4px;font:inherit}
.note{margin:16px 0 0;text-align:center;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="card">
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <g fill="#b83a63"><ellipse cx="32" cy="16" rx="8" ry="14"/><ellipse cx="32" cy="48" rx="8" ry="14"/></g>
    <g fill="#5b3a8c"><ellipse cx="16" cy="32" rx="14" ry="8"/><ellipse cx="48" cy="32" rx="14" ry="8"/></g>
    <circle cx="32" cy="32" r="6" fill="#17111f"/>
  </svg>
  <h1>Discord Media Host</h1>
  <p class="sub">Upload a video or GIF and get a direct link.</p>

  <div class="nav">
    <a class="btn rose" href="/draw.html"><svg class="i" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Draw</a>
    <a class="btn" href="/album.html"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>Album</a>
    <a class="btn" href="/convert.html" style="grid-column:1/-1"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h12l-3-3M20 16H8l3 3"/></svg>Convert to transparent GIF</a>
    <a class="btn rose" href="/editor.html" style="grid-column:1/-1"><svg class="i" viewBox="0 0 24 24"><path d="M8 6l-5 6 5 6M16 6l5 6-5 6"/></svg>Code renderer and editor</a>
  </div>

  <form id="uploadForm">
    <label class="drop" id="fileLabel"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span id="fileText">Choose MP4 or GIF</span>
      <input type="file" id="videoInput" name="video" accept="video/*,image/gif"></label>
    <button type="submit" class="rose" id="uploadBtn" disabled>Upload and get link</button>
  </form>
  <p class="status" id="status" role="status"></p>
  <div id="ld" style="margin-top:12px"></div>

  <div id="preview"><video id="previewMedia" controls autoplay loop muted playsinline></video><img id="previewImg" alt="Uploaded GIF preview" hidden></div>

  <div id="result">
    <input type="text" id="linkOutput" readonly aria-label="Direct link">
    <button id="copyBtn" class="rose" type="button"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg><span>Copy link</span></button>
  </div>
  <p class="note">Files are deleted automatically after 24 hours.</p>
</main>

<script src="/loader.js"></script>
<script>
const $=id=>document.getElementById(id);
const input=$('videoInput'),btn=$('uploadBtn'),status=$('status'),out=$('linkOutput');
const say=(t,err)=>{status.textContent=t;status.classList.toggle('err',!!err)};

input.addEventListener('change',()=>{
  const f=input.files[0];if(!f)return;
  $('fileText').textContent=f.name;btn.disabled=false;say('');
});

$('uploadForm').addEventListener('submit',async e=>{
  e.preventDefault();if(!input.files[0])return;
  const fd=new FormData();fd.append('video',input.files[0]);
  btn.disabled=true;say('');$('result').style.display=$('preview').style.display='none';
  try{
    const data=await Loader.run($('ld'),{url:'/upload',body:fd,upload:true,est:8});
    out.value=data.url;
    const gif=data.url.endsWith('.gif');
    $('previewMedia').hidden=gif;$('previewImg').hidden=!gif;
    if(gif)$('previewImg').src=data.url;else $('previewMedia').src=data.url;
    $('preview').style.display='block';$('result').style.display='block';say('Your link is ready.');
  }catch(err){say(err.message||'Network error during upload.',true)}
  finally{btn.disabled=false}
});

$('copyBtn').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(out.value)}catch(_){out.select();document.execCommand('copy')}
  const s=$('copyBtn').querySelector('span');s.textContent='Copied';setTimeout(()=>s.textContent='Copy link',1500);
});
out.addEventListener('click',()=>out.select());
</script>
</body>
</html>
