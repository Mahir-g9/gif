<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Media Host</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        .card {
            background: #1e293b;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; }
        p { color: #94a3b8; font-size: 0.9rem; }
        .nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 4px; }
        .nav a {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: #334155; color: #f8fafc; text-decoration: none;
            padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem;
            transition: transform 450ms cubic-bezier(0.34, 1.56, 0.64, 1), background 150ms;
        }
        .nav a:hover { background: #475569; }
        .nav a:active { transform: scale(0.95); transition: transform 100ms cubic-bezier(0.16, 1, 0.3, 1); }
        .nav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        input[type="file"] { display: none; }
        .file-upload-btn {
            display: block;
            background: #334155;
            color: #f8fafc;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin: 16px 0;
            border: 2px dashed #64748b;
            font-size: 0.95rem;
        }
        .file-upload-btn:hover { background: #475569; border-color: #38bdf8; }
        button.submit-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
        }
        button.submit-btn:hover { background: #0ea5e9; }
        button:disabled { background: #64748b; cursor: not-allowed; }
        #previewContainer { margin-top: 16px; display: none; }
        #previewMedia, #previewImg {
            max-width: 100%;
            max-height: 220px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        #previewImg { display: none; }
        #result {
            margin-top: 20px;
            text-align: left;
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        #result input {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            border-radius: 4px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        .success-msg { color: #4ade80; font-weight: bold; font-size: 0.85rem; }
        .loading { color: #facc15; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Discord Media Host</h2>
        <p>Upload a video or GIF to generate your direct link. Files are deleted after 24 hours.</p>

        <div class="nav">
            <a href="/draw.html">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
                Draw
            </a>
            <a href="/album.html">
                <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
                Album
            </a>
        </div>

        <form id="uploadForm">
            <label class="file-upload-btn" id="fileLabel">
                📁 Choose MP4 or GIF
                <input type="file" id="videoInput" name="video" accept="video/*,image/gif">
            </label>

            <button type="submit" class="submit-btn" id="uploadBtn" disabled>Upload & Get Link</button>
        </form>

        <div class="loading" id="loadingText">Uploading media... Please wait ⏳</div>

        <div id="previewContainer">
            <video id="previewMedia" controls autoplay loop muted playsinline></video>
            <img id="previewImg" alt="Uploaded GIF preview">
        </div>

        <div id="result">
            <span class="success-msg">✅ Direct Link Ready:</span>
            <input type="text" id="linkOutput" readonly onclick="this.select()">
            <button onclick="copyLink()" style="margin-top: 8px; background: #16a34a; color: white; border: none; padding: 10px; border-radius: 4px; width: 100%; cursor: pointer; font-weight: bold;">Copy Link 📋</button>
        </div>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const fileLabel = document.getElementById('fileLabel');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadForm = document.getElementById('uploadForm');
        const loadingText = document.getElementById('loadingText');
        const previewContainer = document.getElementById('previewContainer');
        const previewMedia = document.getElementById('previewMedia');
        const previewImg = document.getElementById('previewImg');
        const resultDiv = document.getElementById('result');
        const linkOutput = document.getElementById('linkOutput');

        videoInput.addEventListener('change', () => {
            if (videoInput.files.length > 0) {
                fileLabel.innerText = 'Selected: ' + videoInput.files[0].name;
                uploadBtn.disabled = false;
            }
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!videoInput.files[0]) return;

            const formData = new FormData();
            formData.append('video', videoInput.files[0]);

            uploadBtn.disabled = true;
            loadingText.style.display = 'block';
            resultDiv.style.display = 'none';
            previewContainer.style.display = 'none';

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (response.ok) {
                    linkOutput.value = data.url;
                    const isGif = data.url.endsWith('.gif');
                    previewMedia.style.display = isGif ? 'none' : 'inline-block';
                    previewImg.style.display = isGif ? 'inline-block' : 'none';
                    if (isGif) previewImg.src = data.url; else previewMedia.src = data.url;
                    previewContainer.style.display = 'block';
                    resultDiv.style.display = 'block';
                } else {
                    alert(data.error || 'Upload failed!');
                }
            } catch (err) {
                alert('Network error during upload.');
            } finally {
                loadingText.style.display = 'none';
                uploadBtn.disabled = false;
            }
        });

        async function copyLink() {
            try {
                await navigator.clipboard.writeText(linkOutput.value);
            } catch (e) {
                linkOutput.select();
                document.execCommand('copy');
            }
            alert('Link copied to clipboard!');
        }
    </script>
</body>
</html>
