<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album · Discord Media Host</title>
<style>
:root{--bg:#17111f;--card:#261c33;--rose:#b83a63;--plum:#5b3a8c;--text:#ffffff;--muted:#c9bcd8;
--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto 6px}
h1{margin:0;flex:1;font-size:1.4rem}
.btn,button{font:inherit;font-weight:700;color:var(--text);border:0;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;
min-height:44px;padding:0 14px;border-radius:16px 4px 16px 4px;background:var(--plum);transition:transform 450ms var(--spring)}
.btn:active,button:active{transform:scale(.95);transition:transform 100ms var(--out)}
.btn:focus-visible,button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.rose{background:var(--rose)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.note{max-width:900px;margin:0 auto 16px;color:var(--muted);font-size:.85rem}
.grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.item{background:var(--card);padding:10px;display:flex;flex-direction:column;gap:8px;border-radius:28px 6px 28px 6px}
.item video,.item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px 4px 20px 4px;background:var(--bg)}
.time{color:var(--muted);font-size:.75rem;text-align:center}
.item button,.item .btn{width:100%}
.empty{max-width:900px;margin:40px auto;text-align:center;color:var(--muted)}
.empty a{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <a class="btn" href="/" aria-label="Home"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
  <h1>Album</h1>
  <a class="btn rose" href="/draw.html">Draw</a>
  <a class="btn" href="/convert.html">Convert</a>
</header>
<p class="note">Files are deleted automatically 24 hours after upload.</p>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Nothing here yet. <a href="/">Upload a file</a> or <a href="/draw.html">draw an animation</a>.</div>
<script>
const grid=document.getElementById('grid'),empty=document.getElementById('empty');
const icon='<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></svg>';
const dl='<svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>';
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const i=document.createElement('input');i.value=t;document.body.append(i);i.select();document.execCommand('copy');i.remove()}}
function card(m){
  const el=document.createElement('div');el.className='item';
  const media=m.kind==='gif'?`<img src="${m.url}" alt="GIF" loading="lazy">`:m.kind==='audio'?`<audio src="${m.url}" controls preload="none" style="width:100%"></audio>`:`<video src="${m.url}#t=0.1" muted loop playsinline controls preload="metadata"></video>`;
  el.innerHTML=`${media}<span class="time">${new Date(m.createdAt).toLocaleString()}</span><button class="rose">${icon}Share</button><a class="btn" href="${m.url}?dl=1" download>${dl}Download</a>${m.kind!=='video'?'':`<a class="btn" href="${m.url.replace('/uploads/','/audio/')}" download>${dl}MP3</a>`}`;
  const b=el.querySelector('button');
  b.onclick=async()=>{await copy(m.url);b.textContent='Link copied';setTimeout(()=>b.innerHTML=icon+'Share',1500)};
  return el;
}
fetch('/api/media').then(r=>r.json()).then(l=>{if(!Array.isArray(l)||!l.length){empty.hidden=false;return}l.forEach(m=>grid.append(card(m)))})
 .catch(()=>{empty.hidden=false;empty.textContent='Could not load the album. Refresh to try again.'});
</script>
</body>
</html>
